// --- ПЕРЕХОД К СТАТЬЕ ---
function openGoto() { if (!state.doc) return toast('Сначала откройте документ'); $('gotoModal').classList.add('show'); $('gotoInput').value = ''; $('gotoInput').focus(); }
function closeGoto() { $('gotoModal').classList.remove('show'); }
function confirmGoto() { const n = $('gotoInput').value.trim().replace(/^статья\s*/i, ''); if (state.doc?.articles?.[n]) { closeGoto(); openArticle(n); } else toast(`Статья ${n || '—'} не найдена`); }

// --- ПОИСК В ТЕКСТЕ ---
function openDocSearch() {
  const p = $('docSearchPanel');
  if (p.classList.contains('active')) { p.classList.remove('active'); $('docSearchInput').value = ''; state.docSearch = { query: '', matches: [], current: 0 }; $('searchCount').textContent = ''; removeSearchHighlights(); return; }
  p.classList.add('active'); $('docSearchInput').value = ''; $('docSearchInput').focus(); $('searchCount').textContent = '';
}
function performDocSearch() {
  const q = $('docSearchInput').value.trim();
  if (!q) { state.docSearch = { query: '', matches: [], current: 0 }; $('searchCount').textContent = ''; removeSearchHighlights(); return; }
  const c = $('articleBody') || $('workspaceBody'); if (!c) return;
  const matches = []; const lower = q.toLowerCase();
  removeSearchHighlights();
  const walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let node;
  while ((node = walker.nextNode())) { if (node.parentElement.closest('mark')) continue; if (node.textContent.toLowerCase().includes(lower)) nodes.push(node); }
  nodes.forEach(tn => {
    const text = tn.textContent, parent = tn.parentNode, lt = text.toLowerCase();
    let pos = 0, last = 0; const frag = document.createDocumentFragment();
    while ((pos = lt.indexOf(lower, last)) !== -1) {
      if (pos > last) frag.appendChild(document.createTextNode(text.slice(last, pos)));
      const m = document.createElement('mark'); m.textContent = text.slice(pos, pos + q.length); m.dataset.matchIndex = String(matches.length);
      frag.appendChild(m); matches.push(m); last = pos + q.length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    parent.replaceChild(frag, tn);
  });
  state.docSearch = { query: q, matches, current: -1 };
  if (matches.length) { state.docSearch.current = 0; scrollToMatch(0); } else $('searchCount').textContent = 'Нет совпадений';
}
function updateSearchCount() { const { matches, current } = state.docSearch; $('searchCount').textContent = matches.length ? `${current + 1} из ${matches.length}` : ''; }
function scrollToMatch(i) { const { matches } = state.docSearch; if (!matches[i]) return; matches.forEach(m => m.classList.remove('active-match')); matches[i].classList.add('active-match'); matches[i].scrollIntoView({ behavior: 'smooth', block: 'center' }); state.docSearch.current = i; updateSearchCount(); }
function nextMatch() { const { matches, current } = state.docSearch; if (matches.length) scrollToMatch((current + 1) % matches.length); }
function prevMatch() { const { matches, current } = state.docSearch; if (matches.length) scrollToMatch((current - 1 + matches.length) % matches.length); }
function removeSearchHighlights() { document.querySelectorAll('mark').forEach(m => { const p = m.parentNode; if (p) { p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); } }); }
function highlightSearchMatches() { if (!state.docSearch.query) return; const q = state.docSearch.query; $('docSearchInput').value = q; setTimeout(performDocSearch, 50); }

// --- ВОССТАНОВЛЕНИЕ ИЗ HASH ---
async function restoreFromHash() {
  if (state._restoring) return;
  state._restoring = true;
  try {
    const hash = window.location.hash.substring(1); if (!hash) return;
    const p = new URLSearchParams(hash);
    const view = p.get('view'), slug = p.get('doc'), art = p.get('art');
    if (slug && db) { await openDocBySlug(slug, art); return; }
    if (view === 'category') showView('category', p.get('cat') || '');
    else if (view === 'favorites') showView('favorites');
    else if (view === 'history') showView('history');
    else if (view === 'notes') showView('notes');
    else if (view === 'about') showView('about');
    else if (view === 'search-home') showView('search-home');
    else showView('home');
  } finally { state._restoring = false; }
}

// ============================================================
//  IndexedDB: храним каждую часть отдельной записью
// ============================================================
const IDB_NAME = 'PravoDB';
const IDB_STORE = 'files';
const IDB_VERSION = 1;

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
  });
}

function idbGet(idb, key) {
  return new Promise((resolve, reject) => {
    try {
      const tx = idb.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    } catch (e) { reject(e); }
  });
}

function idbPut(idb, key, value) {
  return new Promise((resolve, reject) => {
    let tx;
    try { tx = idb.transaction(IDB_STORE, 'readwrite'); } catch (e) { return reject(e); }
    tx.oncomplete = () => resolve();
    tx.onerror = ev => reject(ev.target.error || new Error('IDB put error'));
    tx.onabort = ev => reject(ev.target.error || new Error('IDB tx aborted'));
    try { tx.objectStore(IDB_STORE).put(value, key); } catch (e) { reject(e); }
  });
}

// ============================================================
//  Загрузка частей базы
// ============================================================
const TOTAL_PARTS = 5;
const PART_KEY = i => `laws.db.part.${String(i).padStart(3, '0')}`;
const PART_URL = i => `./laws.db.${String(i).padStart(3, '0')}`;

async function tryLoadFromIDB(idb) {
  try {
    const chunks = [];
    for (let i = 1; i <= TOTAL_PARTS; i++) {
      const part = await idbGet(idb, PART_KEY(i));
      if (!part || !part.byteLength) return null;
      chunks.push(new Uint8Array(part));
    }
    const total = chunks.reduce((a, c) => a + c.length, 0);
    if (!total) return null;
    const out = new Uint8Array(total);
    let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    return out;
  } catch (e) { console.warn('[РПА] IDB read failed:', e); return null; }
}

async function downloadAndSaveParts(idb) {
  const chunks = [];
  for (let i = 1; i <= TOTAL_PARTS; i++) {
    $('dbStatus').textContent = `Скачивание базы (${i} из ${TOTAL_PARTS})...`;
    const res = await fetch(PART_URL(i), { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} при загрузке ${PART_URL(i)}`);
    const buf = await res.arrayBuffer();
    chunks.push(new Uint8Array(buf));
    try {
      await idbPut(idb, PART_KEY(i), buf);
    } catch (e) {
      console.warn(`[РПА] Не удалось сохранить часть ${i} в IndexedDB:`, e);
    }
  }
  const total = chunks.reduce((a, c) => a + c.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

// ============================================================
//  Инициализация приложения
// ============================================================
async function init() {
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  try {
    const theme = localStorage.getItem('pravo-theme');
    if (theme) { document.documentElement.dataset.theme = theme; if (theme === 'dark') $('themeIcon').outerHTML = icons.sun; }
  } catch {}
  document.documentElement.style.setProperty('--reader-size', state.font + 'px');
  $('favCount').textContent = state.favorites.length;

  $('libSearchInput').addEventListener('input', e => { state.libSearch = e.target.value; renderLibrary(); });
  $('themeBtn').onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('pravo-theme', next); } catch {}
    $('themeIcon').outerHTML = next === 'dark' ? icons.sun : icons.moon;
  };
  $('brandHome').onclick = () => { setHashSafely(''); showView('home'); };
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => showView(b.dataset.view));
  $('menuBtn').onclick = () => { $('sidebar').classList.toggle('open'); $('mobileBackdrop').classList.toggle('show'); };
  $('mobileBackdrop').onclick = closeMobile;
  $('gotoBtn').onclick = openGoto;
  $('cancelGoto').onclick = closeGoto;
  $('confirmGoto').onclick = confirmGoto;
  $('gotoInput').addEventListener('keydown', e => { if (e.key === 'Enter') confirmGoto(); if (e.key === 'Escape') closeGoto(); });
  $('gotoModal').addEventListener('click', e => { if (e.target === $('gotoModal')) closeGoto(); });
  $('favoriteBtn').onclick = toggleFavorite;
  $('printBtn').onclick = () => window.print();
  $('noteBtn').onclick = () => { const a = $('noteArea'); if (a) { a.focus(); a.scrollIntoView({ behavior: 'smooth' }); } };
  $('docSearchBtn').onclick = openDocSearch;
  $('docSearchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); if (state.docSearch.matches.length && state.docSearch.query === e.target.value.trim()) nextMatch(); else performDocSearch(); }
    if (e.key === 'Escape') openDocSearch();
  });
  $('docSearchInput').addEventListener('input', () => {
    const q = $('docSearchInput').value.trim();
    if (q.length >= 2) performDocSearch();
    else if (!q) { removeSearchHighlights(); state.docSearch = { query: '', matches: [], current: 0 }; $('searchCount').textContent = ''; }
  });
  $('searchNext').onclick = nextMatch;
  $('searchPrev').onclick = prevMatch;
  $('searchClose').onclick = () => { $('docSearchPanel').classList.remove('active'); $('docSearchInput').value = ''; state.docSearch = { query: '', matches: [], current: 0 }; $('searchCount').textContent = ''; removeSearchHighlights(); };

  const btt = $('backToTop');
  $('workspaceBody').addEventListener('scroll', () => btt.classList.toggle('show', $('workspaceBody').scrollTop > 300));
  btt.onclick = () => $('workspaceBody').scrollTo({ top: 0, behavior: 'smooth' });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('libSearchInput').focus(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g') { e.preventDefault(); openGoto(); }
    if (e.key === 'Escape') { if ($('gotoModal').classList.contains('show')) closeGoto(); else if (state.docSearch.query) $('searchClose').click(); }
  });

  window.addEventListener('hashchange', () => {
    if (!db || state._suppressHashChange || state._restoring) return;
    if (window.location.hash) restoreFromHash(); else showView('home');
  });

  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(() => {}); } catch {}

  // SQL.js
  $('dbStatus').textContent = 'Инициализация SQLite...';
  try {
    SQL = await initSqlJs({ locateFile: f => `./${f}` });
  } catch (e) {
    $('dbStatus').textContent = 'Ошибка SQL.js';
    $('workspaceBody').innerHTML = `<section class="home"><div class="empty-state"><strong>Не удалось загрузить SQL.js</strong><p>${esc(e.message)}</p></div></section>`;
    return;
  }

  // База: пробуем IndexedDB, иначе скачиваем части
  $('dbStatus').textContent = 'Загрузка базы...';
  let idb = null;
  try { idb = await idbOpen(); } catch (e) { console.warn('[РПА] IndexedDB недоступен:', e); }

  let binaryData = null;
  if (idb) binaryData = await tryLoadFromIDB(idb);

  if (!binaryData) {
    try {
      binaryData = idb ? await downloadAndSaveParts(idb) : await (async () => {
        const chunks = [];
        for (let i = 1; i <= TOTAL_PARTS; i++) {
          $('dbStatus').textContent = `Скачивание (${i} из ${TOTAL_PARTS})...`;
          const res = await fetch(PART_URL(i), { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status} для ${PART_URL(i)}`);
          chunks.push(new Uint8Array(await res.arrayBuffer()));
        }
        const total = chunks.reduce((a, c) => a + c.length, 0);
        const out = new Uint8Array(total);
        let off = 0;
        for (const c of chunks) { out.set(c, off); off += c.length; }
        return out;
      })();
    } catch (err) {
      $('dbStatus').textContent = 'Ошибка загрузки';
      $('workspaceBody').innerHTML = `<section class="home"><div class="empty-state"><strong>Не удалось загрузить базу данных</strong><p>${esc(err.message)}</p><p style="margin-top:12px">Убедитесь, что файлы <code>laws.db.001</code> … <code>laws.db.005</code> лежат рядом с <code>index.html</code>.</p></div></section>`;
      return;
    }
  }

  try {
    db = new SQL.Database(binaryData);
    const res = db.exec(`
      SELECT d.slug, d.code, d.type, d.act_kind, d.base_act, d.redaction_date,
             (SELECT COUNT(*) FROM articles a WHERE a.doc_slug = d.slug) AS articles_total
      FROM documents d
    `);
    state.docs = res.length ? res[0].values.map(row => ({
      slug: row[0], code: row[1], type: row[2], act_kind: row[3],
      base_act: row[4], redaction_date: row[5], articles_total: row[6]
    })) : [];

    console.log('[РПА] Типы в базе:', Array.from(new Set(state.docs.map(d => d.type))));
    console.log('[РПА] Нормализовано:', state.docs.reduce((a, d) => { const t = normalizeType(d); a[t] = (a[t] || 0) + 1; return a; }, {}));

    const k = state.docs.find(isKonst);
    if (k && !state.pinned.includes(k.slug)) { state.pinned.push(k.slug); writeStore('pravo-pinned', state.pinned); }

    $('dbStatus').textContent = 'Источник: pravo.gov.ru';
    renderLibrary();

    if (window.location.hash) await restoreFromHash(); else showView('home');
  } catch (e) {
    console.error(e);
    $('dbStatus').textContent = 'Ошибка SQLite';
    $('workspaceBody').innerHTML = `<section class="home"><div class="empty-state"><strong>Ошибка базы данных</strong><p>${esc(e.message)}</p></div></section>`;
  }
}

init();
